    <path d="M46 84 C 56 92, 72 92, 82 84 C 84 76, 76 70, 64 74 C 52 78, 46 72, 50 64 C 54 56, 66 56, 72 60"/>
    <path d="M48 60 C 58 54, 70 56, 76 64 C 82 72, 76 82, 64 82 C 54 82, 46 78, 46 70"/>
