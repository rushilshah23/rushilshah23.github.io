<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="ITGC controls dashboard illustration">
  <defs>
    <linearGradient id="itgc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15171f"/>
      <stop offset="100%" stop-color="#0d0e13"/>
    </linearGradient>
    <linearGradient id="itgc-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b8cf6"/>
      <stop offset="100%" stop-color="#00f2e6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#itgc-bg)"/>

  <!-- Chart grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="40" y1="70"  x2="600" y2="70"/>
    <line x1="40" y1="130" x2="600" y2="130"/>
    <line x1="40" y1="190" x2="600" y2="190"/>
    <line x1="40" y1="250" x2="600" y2="250"/>
    <line x1="40" y1="310" x2="600" y2="310"/>
    <line x1="40" y1="40" x2="40" y2="330"/>
    <line x1="170" y1="40" x2="170" y2="330"/>
    <line x1="300" y1="40" x2="300" y2="330"/>
    <line x1="430" y1="40" x2="430" y2="330"/>
    <line x1="560" y1="40" x2="560" y2="330"/>
  </g>

  <!-- Control rows (system → evidence → status) -->
  <g font-family="monospace" font-size="14" fill="#8b93a7">
    <text x="60" y="88">SYS-001</text>
    <text x="200" y="88">Access Control</text>
    <rect x="420" y="72" width="120" height="16" rx="3" fill="#34d399" opacity="0.25"/>
    <rect x="420" y="72" width="96" height="16" rx="3" fill="#34d399"/>

    <text x="60" y="148">SYS-002</text>
    <text x="200" y="148">Change Mgmt</text>
    <rect x="420" y="132" width="120" height="16" rx="3" fill="#8b8cf6" opacity="0.25"/>
    <rect x="420" y="132" width="78" height="16" rx="3" fill="#8b8cf6"/>

    <text x="60" y="208">SYS-003</text>
    <text x="200" y="208">Backup &amp; Recovery</text>
    <rect x="420" y="192" width="120" height="16" rx="3" fill="#00f2e6" opacity="0.25"/>
    <rect x="420" y="192" width="108" height="16" rx="3" fill="#00f2e6"/>

    <text x="60" y="268">SYS-004</text>
    <text x="200" y="268">Segregation of Duties</text>
    <rect x="420" y="252" width="120" height="16" rx="3" fill="#fbbf24" opacity="0.25"/>
    <rect x="420" y="252" width="54" height="16" rx="3" fill="#fbbf24"/>
  </g>

  <!-- Trend line: compliance rising -->
  <polyline points="60,290 140,270 220,278 300,252 380,258 460,234 540,222 600,210"
            fill="none" stroke="url(#itgc-accent)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="600" cy="210" r="6" fill="#00f2e6"/>
  <circle cx="600" cy="210" r="11" fill="#00f2e6" opacity="0.3"/>

  <!-- Title -->
  <text x="60" y="46" font-family="monospace" font-size="13" fill="#8b8cf6">ITGC · CONTROL COVERAGE</text>
</svg>
