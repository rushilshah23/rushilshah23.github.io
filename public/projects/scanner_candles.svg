<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Candlestick chart with rising price action and a breakout signal marker">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15171f"/>
      <stop offset="100%" stop-color="#0d0e13"/>
    </linearGradient>
    <linearGradient id="sc-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b8cf6"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sc-bg)"/>

  <!-- Chart grid -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <line x1="40" y1="80"  x2="600" y2="80"/>
    <line x1="40" y1="140" x2="600" y2="140"/>
    <line x1="40" y1="200" x2="600" y2="200"/>
    <line x1="40" y1="260" x2="600" y2="260"/>
  </g>

  <!-- HUD labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6b7488" letter-spacing="0.08em">
    <text x="48" y="28">NSE · DAILY</text>
    <text x="48" y="48">SCAN: 20D-BREAKOUT</text>
    <text x="592" y="28" text-anchor="end">▲ 34D399</text>
    <text x="592" y="48" text-anchor="end">▼ F87171</text>
  </g>

  <!-- Wicks -->
  <g stroke="#34d399" stroke-width="2">
    <line x1="52" y1="240" x2="52" y2="258"/><line x1="80" y1="232" x2="80" y2="250"/>
    <line x1="108" y1="228" x2="108" y2="246"/><line x1="136" y1="224" x2="136" y2="244"/>
    <line x1="164" y1="222" x2="164" y2="236"/><line x1="192" y1="212" x2="192" y2="234"/>
    <line x1="220" y1="204" x2="220" y2="222"/><line x1="248" y1="206" x2="248" y2="220"/>
    <line x1="276" y1="194" x2="276" y2="218"/><line x1="304" y1="186" x2="304" y2="204"/>
    <line x1="332" y1="174" x2="332" y2="196"/><line x1="360" y1="166" x2="360" y2="184"/>
    <line x1="388" y1="168" x2="388" y2="182"/><line x1="416" y1="154" x2="416" y2="180"/>
    <line x1="444" y1="144" x2="444" y2="164"/><line x1="472" y1="132" x2="472" y2="154"/>
    <line x1="500" y1="132" x2="500" y2="146"/><line x1="528" y1="118" x2="528" y2="144"/>
    <line x1="556" y1="110" x2="556" y2="128"/><line x1="584" y1="96"  x2="584" y2="120"/>
  </g>

  <!-- Red candles (down days) -->
  <g fill="#f87171">
    <rect x="101" y="228" width="14" height="12" rx="1"/>
    <rect x="157" y="222" width="14" height="8"  rx="1"/>
    <rect x="241" y="206" width="14" height="8"  rx="1"/>
    <rect x="381" y="168" width="14" height="8"  rx="1"/>
    <rect x="493" y="132" width="14" height="8"  rx="1"/>
  </g>

  <!-- Green candles (up days) -->
  <g fill="#34d399">
    <rect x="45"  y="244" width="14" height="8"  rx="1"/>
    <rect x="73"  y="238" width="14" height="6"  rx="1"/>
    <rect x="129" y="228" width="14" height="12" rx="1"/>
    <rect x="185" y="216" width="14" height="14" rx="1"/>
    <rect x="213" y="210" width="14" height="6"  rx="1"/>
    <rect x="269" y="198" width="14" height="16" rx="1"/>
    <rect x="297" y="192" width="14" height="6"  rx="1"/>
    <rect x="325" y="180" width="14" height="12" rx="1"/>
    <rect x="353" y="172" width="14" height="8"  rx="1"/>
    <rect x="409" y="160" width="14" height="16" rx="1"/>
    <rect x="437" y="150" width="14" height="10" rx="1"/>
    <rect x="465" y="138" width="14" height="12" rx="1"/>
    <rect x="521" y="124" width="14" height="16" rx="1"/>
    <rect x="549" y="116" width="14" height="8"  rx="1"/>
    <rect x="577" y="104" width="14" height="12" rx="1"/>
  </g>

  <!-- 20-EMA trend line -->
  <polyline
    points="52,244 80,238 108,240 136,228 164,230 192,216 220,210 248,214 276,198 304,192 332,180 360,172 388,176 416,160 444,150 472,138 500,140 528,124 556,116 584,104"
    fill="none"
    stroke="url(#sc-line)"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Breakout signal marker on the final candle -->
  <g>
    <polygon points="584,74 576,92 592,92" fill="#34d399"/>
    <text x="600" y="70" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#34d399">SIGNAL ▲</text>
  </g>

  <!-- Cursor crosshair flourish -->
  <line x1="584" y1="92" x2="584" y2="300" stroke="#8b8cf6" stroke-width="1" stroke-dasharray="3 5" opacity="0.5"/>
</svg>
