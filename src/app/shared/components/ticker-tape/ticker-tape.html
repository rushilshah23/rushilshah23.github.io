<div class="ticker" role="presentation" aria-hidden="true">
  <div class="ticker__track">
    <ul class="ticker__list">
      @for (item of ticks(); track item; let i = $index) {
        <li class="ticker__item">
          <span class="ticker__symbol">{{ item }}</span>
          <span
            class="ticker__tick"
            [class.ticker__tick--up]="i % 2 === 0"
            [class.ticker__tick--down]="i % 2 !== 0"
          >
            {{ i % 2 === 0 ? '▲' : '▼' }}
          </span>
        </li>
      }
    </ul>
  </div>
</div>
