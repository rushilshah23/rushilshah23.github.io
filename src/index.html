<!doctype html>

<head>

  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d0e13" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">

  <!-- Open Graph / social sharing (per-page values are set at runtime) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_IN">
  <meta property="og:site_name" content="Rushil Shah">
  <meta property="og:title" content="Rushil Shah — Senior Engineer · Full-Stack, Platform & GenAI">
  <meta property="og:description" content="5+ years shipping full-stack platforms, cloud infrastructure and GenAI systems across lending, insurance, banking and energy.">
  <meta property="og:image" content="https://rushilshah23.github.io/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@rushilshah88">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="canonical" href="https://rushilshah23.github.io/">

  <!-- Fonts: non-blocking load with swap fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    media="print"
    onload="this.media='all'"
  >
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    >
  </noscript>

  <script>
    // Apply persisted or system theme before first paint to avoid flash.
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      var dark = stored === 'dark' ||
        (stored === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var attr = dark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', attr);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
